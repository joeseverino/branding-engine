name: release

# Publish to npm via Trusted Publishing (OIDC) on a version tag. No tokens:
# auth comes from GitHub's OIDC token, and npm attaches a provenance attestation.
# Cut a release with: npm version <patch|minor|major> && git push --follow-tags
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # required for Trusted Publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Exact LTS release includes npm 11.17.0, which supports Trusted Publishing.
          node-version: 24.19.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run check
      - name: Verify tag matches package version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$PACKAGE_VERSION"
      # Idempotent publish: skip if this exact version is already on npm. Lets a
      # re-pushed tag (e.g. re-signing) re-run green instead of failing on E409.
      - name: Publish to npm if not already published
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if npm view "branding-engine@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "branding-engine@$PACKAGE_VERSION already published; skipping publish."
          else
            npm publish
          fi
